[tool.poetry]
name = "backend"
version = "1.0.0"
description = "Backend"
authors = ["Core Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = {version="^0.54.0", extras=["standard"]}
gunicorn = "^26.2.0"
pydantic = "^2.14.1"
pydantic-settings = "2.16.2"
SQLAlchemy = {version="^2.1.6", extras=["asyncio"]}
pillow = "^13.0.0"
asyncpg = "^0.32.0"
redis = "^8.1.0"
hiredis = "^3.5.0"
minio = "^7.2.20"
httpx = "^0.28.1"
PyJWT = "^2.15.1"
livekit-api = "^1.2.2"
safetext = "^0.3.3"
chardet = "^7.7.0"
python-socketio = "^5.17.0"
python-engineio = "^4.15.1"
python-multipart = "0.0.32"
structlog = "^26.1.0"

[tool.poetry.group.dev.dependencies]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-select = ["I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
