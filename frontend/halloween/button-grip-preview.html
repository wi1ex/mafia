<!doctype html>
<html lang="ru" data-home-season="halloween">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Захват кнопки — Halloween</title>
<link rel="stylesheet" href="./theme.css">
<style>
@font-face{font-family:Hauora-Regular;src:url("../src/assets/fonts/Hauora-Regular.ttf")}
@font-face{font-family:Involve-Medium;src:url("../src/assets/fonts/Involve-Medium.ttf")}
:root{--home-season-button-fingers:url("./button-fingers.png");--home-season-button-web:url("./button-web.svg")}
body{margin:0;padding:30px 20px;background:#070707;color:#fff;font:16px/1.5 Hauora-Regular,Arial,sans-serif}
main{max-width:900px;margin:auto}h1{font:24px/1.3 Involve-Medium,Arial,sans-serif;margin:0 0 12px}p{color:#aaaad0;margin:0 0 24px}
.home-page>.left{border-radius:24px;background:#171723}.home-page>.left>header{display:flex;justify-content:space-between;align-items:center;gap:25px;padding:40px 30px 36px}
.left-title{font:24px/1.2 Involve-Medium,Arial,sans-serif;margin:0}
.ui-button{display:inline-flex;box-sizing:border-box;align-items:center;justify-content:center;gap:8px;height:64px;padding:0 var(--ui-button-padding-x,16px);border:0;border-radius:var(--ui-button-radius,999px);background:#00cd9b;color:#fff;font:18px/22px Hauora-Regular,Arial,sans-serif;white-space:nowrap;cursor:pointer}
.ui-button__text{overflow:hidden;text-overflow:ellipsis}.ui-button__icon{display:grid;place-items:center;width:24px;height:24px;font:32px/24px Arial,sans-serif}
.ui-button:disabled{background:#4e4e4e;color:#b0b0b0;cursor:not-allowed}
.controls{display:flex;align-items:center;gap:10px;margin-top:28px;color:#aaaad0}input{width:18px;height:18px}
@media(max-width:650px){.home-page>.left>header{align-items:flex-start;flex-direction:column;padding:35px 25px}.ui-button{align-self:center}.left-title{font-size:21px}}
</style>
</head>
<body><main>
<h1>Пальцы зажимают кнопку</h1>
<p>Наведите курсор на кнопку или выберите её клавишей Tab. При нажатии захват немного сильнее. Системная настройка уменьшения движения отключает анимацию.</p>
<section class="home-page"><div class="left"><header>
<h2 class="left-title">Список комнат</h2>
<button type="button" class="ui-button create-room-button" id="grip-button"><span class="ui-button__text">Создать комнату</span><span class="ui-button__icon" aria-hidden="true">+</span></button>
</header></div></section>
<label class="controls"><input type="checkbox" id="disable-button">Показать недоступную кнопку</label>
</main>
<script>
document.getElementById('disable-button').addEventListener('change',function(event){
  document.getElementById('grip-button').disabled=event.target.checked;
});
</script>
</body>
</html>
