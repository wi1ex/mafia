<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween — кнопка профиля</title>
<style>
@font-face{font-family:Hauora;src:url("../src/assets/fonts/Hauora-Regular.ttf")}
@font-face{font-family:Involve;src:url("../src/assets/fonts/Involve-Medium.ttf")}
body{margin:0;background:#090c10;color:#f6f6f7;font-family:Hauora,Arial,sans-serif}
#profile-options{max-width:1600px;margin:auto;padding:24px 18px 32px;--profile-bg:#171723;--profile-hover:#2d2d46}
#profile-options *{box-sizing:border-box}
#profile-options button,#profile-options input{font:inherit}
#profile-options button{cursor:pointer}
#profile-options button:focus-visible,#profile-options input:focus-visible{outline:2px solid #8ad4d0;outline-offset:5px}
#profile-options h1{font:24px Involve;margin:0 0 18px}
#profile-options .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
#profile-options .choice{padding:10px 15px;border:1px solid #3b424d;border-radius:99px;background:#131923;color:#becbd2}
#profile-options .choice[aria-pressed="true"]{background:#4d2c1d;border-color:#c27b43;color:#fff}
#profile-options .settings{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px;color:#aebbc4;font-size:14px}
#profile-options .settings label{display:flex;align-items:center;gap:6px}
#profile-options .themes{display:flex;gap:6px}
#profile-options .themes .choice{padding:7px 10px;font-size:13px}
#profile-options .viewport{position:relative;width:100%;overflow:hidden;border-radius:18px;background:#070707}
#profile-options .product{width:1600px;height:210px;transform-origin:top left;background:#070707;position:relative;padding-top:10px}
#profile-options .bar{height:64px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}
#profile-options .left,#profile-options .right{display:flex;align-items:center;gap:12px}
#profile-options .left{gap:24px}
#profile-options .logo{padding:0 16px;display:flex;align-items:center;gap:6px;height:64px;border-radius:16px;background:#171723}
#profile-options .logo-word{width:121.6px;height:52px;transform:translateY(6px)}
#profile-options .pumpkin{width:46px;height:46px}
#profile-options .nav{display:flex;align-items:center;gap:8px;font-size:18px;color:#aaaad0;padding:0 14px;height:64px}
#profile-options .nav img{width:24px;height:24px;opacity:.8;filter:brightness(0) invert(1)}
#profile-options .right>.nav{background:#171723;border-radius:16px}
#profile-options .profile-wrap{position:relative;display:inline-block}
#profile-options .profile{display:inline-flex;align-items:center;justify-content:center;height:64px;padding:20px 16px;border:0;border-radius:16px;background:var(--profile-bg);color:#fff;text-decoration:none;position:relative;isolation:isolate;white-space:nowrap;transition:box-shadow .2s,background .2s}
#profile-options .profile:hover,#profile-options .profile[aria-expanded="true"],#profile-options .profile.forced-hover{background:var(--profile-hover)}
#profile-options .avatar{position:relative;z-index:2;width:24px;height:24px;object-fit:cover;border-radius:50%;background:#7d868d}
#profile-options .nickname{position:relative;z-index:2;max-width:250px;overflow:hidden;text-overflow:ellipsis;font-size:18px;line-height:20px;letter-spacing:-.36px;margin-left:8px}
#profile-options .chevron{position:relative;z-index:2;width:20px;height:20px;margin-left:8px;transition:transform .2s}
#profile-options .profile[aria-expanded="true"] .chevron{transform:rotate(180deg)}
#profile-options .ornament{display:none;position:absolute;pointer-events:none;z-index:3}
#profile-options[data-variant="copper"] .profile{box-shadow:inset 0 0 0 1px #bd7a4977,inset 0 1px 1px #eccba221}
#profile-options[data-variant="copper"] .avatar{box-shadow:0 0 0 2px #a96a32}
#profile-options[data-variant="copper"] .profile:hover,#profile-options[data-variant="copper"] .profile.forced-hover,#profile-options[data-variant="copper"] .profile[aria-expanded="true"]{box-shadow:inset 0 0 0 1px #f2ac62,0 2px 16px #a761142a}
#profile-options[data-variant="web"] .profile{box-shadow:inset 0 0 0 1px #638a8170,inset 0 1px 0 #bbd7c21c;overflow:hidden}
#profile-options[data-variant="web"] .web{display:block;top:0;right:0;width:29px;height:29px;background:url("./button-web.svg") center/contain no-repeat;opacity:.9}
#profile-options[data-variant="web"] .avatar{box-shadow:0 0 0 1px #b67e48}
#profile-options[data-variant="web"] .profile:hover,#profile-options[data-variant="web"] .profile.forced-hover,#profile-options[data-variant="web"] .profile[aria-expanded="true"]{box-shadow:inset 0 0 0 1px #dca66b,0 2px 14px #bc6a1820}
#profile-options[data-variant="claws"] .profile{box-shadow:inset 0 0 0 1px #9f704c88,inset 0 1px 0 #d1c0c128;overflow:visible}
#profile-options[data-variant="claws"] .claw{display:block;top:-12px;width:30px;height:30px;background-image:url("./button-fingers.png");background-size:180px 71px;background-repeat:no-repeat}
#profile-options[data-variant="claws"] .claw-left{left:9px;background-position:-12px 0}
#profile-options[data-variant="claws"] .claw-right{right:7px;background-position:-134px 0}
#profile-options[data-variant="claws"] .profile:hover,#profile-options[data-variant="claws"] .profile.forced-hover,#profile-options[data-variant="claws"] .profile[aria-expanded="true"]{box-shadow:inset 0 0 0 1px #e8a166,0 2px 14px #ab691c30}
#profile-options .menu{position:absolute;z-index:10;right:0;top:72px;width:218px;background:#f1f1f1;color:#171717;border-radius:20px;box-shadow:0 8px 24px #0006;padding:12px 8px}
#profile-options .menu[hidden]{display:none}
#profile-options .menu-name{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;border-bottom:1px solid #d7d7db;margin-bottom:5px;color:#202023}
#profile-options .menu .avatar{width:32px;height:32px}
#profile-options .menu button{display:flex;width:100%;align-items:center;gap:9px;border:0;border-radius:12px;padding:10px;background:transparent;text-align:left;color:#292933;font-size:15px}
#profile-options .menu button:hover{background:#e2e5e9}
#profile-options .menu button img{width:20px;height:20px;filter:brightness(.2)}
#profile-options .details{display:flex;flex-wrap:wrap;gap:24px;margin-top:24px}
#profile-options .sample{flex:1;min-width:310px;padding:20px 24px 110px;background:#0c1017;border-radius:18px;overflow:visible}
#profile-options .sample-label{font-size:14px;color:#99abb7;margin-bottom:38px}
#profile-options .sample .profile-wrap{transform:scale(1.55);transform-origin:top left}
#profile-options .sample .nickname{max-width:clamp(96px,22vw,250px)}
#profile-options .description{font-size:15px;line-height:1.5;color:#a9bac2;margin:20px 0 0}
#profile-options .state-notice{font-size:13px;color:#7f929e;margin-top:18px}
@media(max-width:700px){#profile-options{padding:20px 12px}#profile-options .sample{min-width:0;flex-basis:100%;padding-left:18px}#profile-options .sample .profile-wrap{transform:scale(1.25)}}
</style></head>
<body><main id="profile-options" data-variant="claws">
<h1>Кнопка профиля — варианты Halloween</h1>
<nav class="controls" aria-label="Вариант оформления">
<button class="choice variant" type="button" data-variant="copper" aria-pressed="false">Медная рамка</button>
<button class="choice variant" type="button" data-variant="web" aria-pressed="false">Паутинка</button>
<button class="choice variant" type="button" data-variant="claws" aria-pressed="true">Когти</button>
</nav>
<div class="settings"><span>Фон профиля:</span><div class="themes">
<button class="choice theme" type="button" data-theme="default" aria-pressed="true">Обычный</button>
<button class="choice theme" type="button" data-theme="teal" aria-pressed="false">Бирюзовый</button>
<button class="choice theme" type="button" data-theme="purple" aria-pressed="false">Фиолетовый</button>
</div><label><input id="long-name" type="checkbox">Длинный ник</label></div>
<section class="viewport" aria-label="В хедере"><div class="product"><header class="bar">
<div class="left"><div class="logo"><img class="logo-word" src="./logo-halloween.svg" alt="deceit"><img class="pumpkin" src="./evil-pumpkin.png" alt=""></div>
<div class="nav"><img src="../src/assets/svg/iconInfo.svg" alt="">Правила</div><div class="nav"><img src="../src/assets/svg/iconHistory.svg" alt="">История игр</div></div>
<div class="right"><div class="nav"><img src="../src/assets/svg/iconNotifBell.svg" alt="">Уведомления</div><div class="nav"><img src="../src/assets/svg/iconFriends.svg" alt="">Друзья</div><div class="nav"><img src="../src/assets/svg/iconChat.svg" alt="">Чат</div><div class="profile-wrap" data-profile></div></div>
</header></div></section>
<section class="details" aria-label="Увеличенные состояния"><div class="sample"><div class="sample-label">Обычное состояние</div><div class="profile-wrap" data-profile></div></div><div class="sample"><div class="sample-label">При наведении</div><div class="profile-wrap" data-profile data-hover></div></div></section>
<p class="description" id="description">Два небольших когтя держат верхние края. Центр кнопки, аватар и стрелка остаются открытыми.</p>
<p class="state-notice" id="notice" aria-live="polite">Превью · кнопка открывает демонстрационное меню</p>
</main>
<script>
(function(){
'use strict';
var root=document.getElementById('profile-options');
var descriptions={
copper:'Тонкая медная рамка и тёплое кольцо вокруг аватара. Самый спокойный вариант рядом с кровавым логотипом.',
web:'Тёмная поверхность, бирюзово-медный край и небольшая паутинка в углу. Мягко повторяет декор кнопки создания комнаты.',
claws:'Два небольших когтя держат верхние края. Центр кнопки, аватар и стрелка остаются открытыми.'
};
var themes={default:['#171723','#2d2d46'],teal:['linear-gradient(120deg,#153e39,#1d5e50)','#276e5d'],purple:['linear-gradient(120deg,#332e52,#503667)','#684782']};
root.querySelectorAll('[data-profile]').forEach(function(wrap){
wrap.innerHTML='<button type="button" class="profile'+(wrap.hasAttribute('data-hover')?' forced-hover':'')+'" aria-expanded="false" aria-haspopup="menu"><span class="ornament web" aria-hidden="true"></span><span class="ornament claw claw-left" aria-hidden="true"></span><span class="ornament claw claw-right" aria-hidden="true"></span><img class="avatar" src="../src/assets/svg/iconDefaultAvatar.svg" alt="Аватар"><span class="nickname">Luna</span><img class="chevron" src="../src/assets/svg/iconArrow.svg" alt=""></button><div class="menu" role="menu" hidden><div class="menu-name"><img class="avatar" src="../src/assets/svg/iconDefaultAvatar.svg" alt=""><span>Luna</span></div><button type="button" role="menuitem"><img src="../src/assets/svg/iconMiniProfile.svg" alt="">Профиль</button><button type="button" role="menuitem"><img src="../src/assets/svg/iconProfile.svg" alt="">Личный кабинет</button><button type="button" role="menuitem"><img src="../src/assets/svg/iconLeave.svg" alt="">Выйти</button></div>';
var button=wrap.querySelector('.profile'),menu=wrap.querySelector('.menu');
button.addEventListener('click',function(){var opened=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!opened));menu.hidden=opened;});
menu.querySelectorAll('button').forEach(function(item){item.addEventListener('click',function(){root.querySelector('#notice').textContent='Это превью: данные и настройки профиля не изменяются';});});
});
root.querySelectorAll('.variant').forEach(function(button){button.addEventListener('click',function(){root.dataset.variant=button.dataset.variant;root.querySelectorAll('.variant').forEach(function(other){other.setAttribute('aria-pressed',String(other===button));});root.querySelector('#description').textContent=descriptions[button.dataset.variant];});});
root.querySelectorAll('.theme').forEach(function(button){button.addEventListener('click',function(){var colors=themes[button.dataset.theme];root.style.setProperty('--profile-bg',colors[0]);root.style.setProperty('--profile-hover',colors[1]);root.querySelectorAll('.theme').forEach(function(other){other.setAttribute('aria-pressed',String(other===button));});});});
root.querySelector('#long-name').addEventListener('change',function(event){var name=event.target.checked?'ОченьДлинныйНикИгрокаНаХеллоуин':'Luna';root.querySelectorAll('.nickname,.menu-name span').forEach(function(node){node.textContent=name;});});
root.addEventListener('keydown',function(event){if(event.key==='Escape')root.querySelectorAll('[data-profile]').forEach(function(wrap){wrap.querySelector('.profile').setAttribute('aria-expanded','false');wrap.querySelector('.menu').hidden=true;});});
var viewport=root.querySelector('.viewport'),product=root.querySelector('.product');
function fit(){var scale=Math.min(1,viewport.clientWidth/1600);product.style.transform='scale('+scale+')';viewport.style.height=(210*scale)+'px';}
window.addEventListener('resize',fit);if(typeof ResizeObserver!=='undefined')new ResizeObserver(fit).observe(viewport);fit();
})();
</script></body></html>
